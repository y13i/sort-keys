name: publish
on:
  release:
    types:
      - published
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jetify-com/devbox-install-action@v0.16.0
        with:
          enable-cache: "false"
      - run: devbox run -- pnpm ci
      - run: devbox run -- pnpm run build
      - run: devbox run -- pnpm publish --no-git-checks --access=public
