name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jetify-com/devbox-install-action@v0.16.0
        with:
          enable-cache: "true"
      - run: devbox run -- pnpm ci
      - run: devbox run -- pnpm run build
      - run: devbox run -- pnpm test
      - run: devbox run -- pnpm run lint
      - run: devbox run -- pnpm run typecheck
